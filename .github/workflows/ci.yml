name: Validate application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: gtt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run backend:build
      - run: npm test
      - name: Verify auth, game recovery and database transactions
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://postgres:integration-test-only@127.0.0.1:5432/gtt_test
          CORS_ORIGIN: http://localhost:5173
          GUESSTHETEAM_TEAM_SOURCE: postgres
          MIGRATION_TEST_DATABASE: 'true'
        run: |
          npm run db:migrate
          node --import tsx scripts/check-db-migration.ts
