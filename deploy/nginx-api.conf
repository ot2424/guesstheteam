# Enable only after DNS points api.guesstheteam.de at this server.
# Bootstrap certificate:
# certbot certonly --webroot -w /var/www/letsencrypt -d api.guesstheteam.de
server {
    listen 80;
    listen [::]:80;
    server_name api.guesstheteam.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

