limit_req_zone $binary_remote_addr zone=gtt_api_requests:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=gtt_api_connections:10m;

server {
    server_tokens off;
    listen 80;
    listen [::]:80;
    server_name api.guesstheteam.de;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://api.guesstheteam.de$request_uri;
    }
}

server {
    server_tokens off;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.guesstheteam.de;
    ssl_certificate /etc/letsencrypt/live/api.guesstheteam.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.guesstheteam.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        limit_req zone=gtt_api_requests burst=30 nodelay;
        limit_conn gtt_api_connections 30;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
